# me.example.com -> mastan-me on 127.0.0.1:3100. Never default_server (that stays with the mastan vhost).
server {
    listen 80;
    listen [::]:80;
    server_name me.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name me.example.com;
    ssl_certificate /etc/letsencrypt/live/mastan-me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mastan-me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/mastan-me.access.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location = /healthz { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }
}
